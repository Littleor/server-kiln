name: ServerKiln
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, en, Base]
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "14"
    CODE_SIGN_STYLE: Automatic
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  ServerKiln:
    path: .
targets:
  ServerKiln-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/ServerKiln
      - path: Resources
        excludes: [Licenses]
      - path: build/mac-icon/AppIcon.icns
        optional: true
        buildPhase: resources
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: ServerKiln
        product: ServerKilnCore
      - package: ServerKiln
        product: ServerKilnSSH
      - package: ServerKiln
        product: ServerKilnSync
      - package: ServerKiln
        product: ServerKilnUI
    entitlements:
      path: Config/ServerKiln.entitlements
      properties:
        com.apple.developer.aps-environment: development
        com.apple.developer.icloud-container-identifiers: [iCloud.cn.littleor.serverkiln]
        com.apple.developer.icloud-services: [CloudKit]
        keychain-access-groups:
          - $(AppIdentifierPrefix)cn.littleor.serverkiln.shared
          - $(AppIdentifierPrefix)cn.littleor.serverkiln.terminal
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: ServerKiln
        CFBundleName: ServerKiln
        CFBundleIconFile: AppIcon
        CFBundleDevelopmentRegion: zh-Hans
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        SUFeedURL: https://github.com/Littleor/server-kiln/releases/latest/download/appcast.xml
        SUPublicEDKey: 2BvzG3V/aQw5nifs1iuP+X17cMF4gdwgt9/3h8qbfuo=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false
        SUSendProfileInfo: false
        LSUIElement: true
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.littleor.serverkiln
        PRODUCT_NAME: ServerKiln
        ENABLE_HARDENED_RUNTIME: YES
        ARCHS: arm64 x86_64
        ONLY_ACTIVE_ARCH: NO
