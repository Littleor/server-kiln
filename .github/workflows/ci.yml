name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public boundary and documentation
        run: |
          python3 scripts/check-repository.py
          bash -n scripts/build-app.sh scripts/release-mac.sh scripts/package-release.sh scripts/publish-release.sh
      - name: Scan source and history for secrets
        run: |
          brew install gitleaks
          gitleaks git --redact --no-banner --log-opts=--all
      - name: Test
        run: python3 scripts/test-swift.py
      - name: Build universal app with both languages
        run: scripts/build-app.sh
      - name: Verify packaged resources
        run: |
          test -s dist/ServerKiln.app/Contents/Resources/en.lproj/Localizable.strings
          test -s dist/ServerKiln.app/Contents/Resources/zh-Hans.lproj/Localizable.strings
          codesign --verify --deep --strict dist/ServerKiln.app
          lipo dist/ServerKiln.app/Contents/MacOS/ServerKiln -verify_arch arm64 x86_64
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify contracts, source boundary and documentation
        run: |
          python scripts/check-repository.py
      - name: Test and package Windows application
        shell: pwsh
        run: scripts/build-windows.ps1 -Package -Snapshots
      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ServerKiln-windows
          path: |
            dist/ServerKiln-*-win-x64.zip
            dist/ServerKiln-*-win-x64.zip.sha256
          if-no-files-found: error
      - name: Upload synthetic Windows screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ServerKiln-windows-screenshots
          path: build/windows/screenshots
          if-no-files-found: error
