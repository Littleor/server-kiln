name: Prepare release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          test "$REF_NAME" = "v$(cat VERSION)"
          test -f "docs/releases/$REF_NAME.md"
          python3 scripts/check-public-tree.py --history
          python3 scripts/check-docs.py
          python3 -m unittest discover -s Tests/RepositoryTests
          swift test --force-resolved-versions
  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create draft for locally signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(cat VERSION)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
          else
            gh release create "v$VERSION" --verify-tag --draft \
              --title "ServerKiln $VERSION" --notes-file "docs/releases/v$VERSION.md"
          fi
