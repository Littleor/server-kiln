name: Prepare release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          test "$REF_NAME" = "v$(cat VERSION)"
          test -f "docs/releases/$REF_NAME.md"
          python3 scripts/check-public-tree.py --history
          python3 scripts/check-docs.py
          python3 -m unittest discover -s Tests/RepositoryTests
          python3 scripts/test-swift.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Verify release tag and build Windows package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:REF_TYPE -ne 'tag' -or $env:REF_NAME -ne "v$version") { throw 'Release must use the matching version tag.' }
          scripts/build-windows.ps1 -Package
      - name: Preserve verified Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ServerKiln-windows-release
          path: |
            dist/ServerKiln-*-win-x64.zip
            dist/ServerKiln-*-win-x64.zip.sha256
          if-no-files-found: error
  draft:
    needs: [verify, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Create draft for locally signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="$(cat VERSION)"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo 'Release already exists; leaving it unchanged.'
          else
            gh release create "v$VERSION" --verify-tag --draft \
              --title "ServerKiln $VERSION" --notes-file "docs/releases/v$VERSION.md"
          fi
  windows-assets:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download verified Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ServerKiln-windows-release
          path: dist
      - name: Validate archive and attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(cat VERSION)"
          python3 scripts/check-windows-package.py --directory dist --version "$VERSION"
          if [ "$(gh release view "$REF_NAME" --json isDraft --jq .isDraft)" != true ]; then
            echo 'Published release left unchanged; attach Windows artifacts manually if intended.'
            exit 0
          fi
          gh release upload "$REF_NAME" "dist/ServerKiln-$VERSION-win-x64.zip" \
            "dist/ServerKiln-$VERSION-win-x64.zip.sha256"
